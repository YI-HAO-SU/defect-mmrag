services:
  qdrant:
    image: qdrant/qdrant:v1.18.1
    container_name: defect-mmrag-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC (faster for high-throughput ingestion)
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 3s
      retries: 5

  # vLLM inference server — GPU required.
  # First run downloads Qwen2.5-VL-3B (~7GB) from HuggingFace.
  # HF cache is mounted from the host so re-starts are instant.
  # Start with: docker compose -f docker/docker-compose.yml up vllm
  vllm:
    image: vllm/vllm-openai:latest
    container_name: defect-mmrag-vllm
    runtime: nvidia
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${HF_CACHE_DIR}:/root/.cache/huggingface
    ports:
      - "8000:8000"
    command: >
      Qwen/Qwen2.5-VL-3B-Instruct
      --dtype bfloat16
      --max-model-len 4096
      --gpu-memory-utilization 0.85
      --enable-prefix-caching
      --max-num-seqs 4
      --port 8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles: ["gpu"]   # docker compose --profile gpu up vllm
    ipc: host           # required for vLLM shared memory

  # Optional FastAPI app container. Build with:
  #   docker compose -f docker/docker-compose.yml build app
  # Note: this container needs to talk to the host's vLLM server.
  # On Linux use --network=host or add an extra_hosts entry.
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    container_name: defect-mmrag-app
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      QDRANT_HOST: qdrant
      VLLM_BASE_URL: http://host.docker.internal:8000/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles: ["full"]  # only starts with `--profile full`

  # One-off ingest container: docker compose --profile ingest run --rm ingest
  # Or via Makefile: make ingest
  ingest:
    build:
      context: ..
      dockerfile: docker/Dockerfile.app
    container_name: defect-mmrag-ingest
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ../data:/app/data:ro
    environment:
      QDRANT_HOST: qdrant
    profiles: ["ingest"]
    restart: "no"

volumes:
  qdrant_data:
